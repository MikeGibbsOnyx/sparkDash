# Modified by Onyx AI Labs, 2026: shared/ mount, ipc volume, and the AI Gateway service.
services:
  sparkdash:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      args:
        # Frontend metrics-history retention (hours). Baked in when the frontend is
        # built: for host builds set VITE_HISTORY_HOURS in the shell that runs
        # `npm run build`; this arg only matters if you build the image itself.
        VITE_HISTORY_HOURS: ${VITE_HISTORY_HOURS:-8}
    container_name: sparkDash
    # always: come back after host reboot even if the container was stopped
    # before shutdown (unlike unless-stopped, which stays down after a manual stop).
    restart: always
    # Auto-restart Node when ./server files change (no image rebuild)
    command: ["node", "--watch", "server/index.js"]
    # Host network so local LLM probes reach loopback-bound servers
    # (ds4-server / start.sh default --host 127.0.0.1). Bridge NAT cannot
    # reach the host's 127.0.0.1, and LAN-IP probes miss loopback binds.
    network_mode: host
    privileged: true
    # Share host PID namespace so nvidia-smi compute-apps sees GPU processes
    # (otherwise local VRAM falls back to minute-old config/gpu-memory.json).
    pid: host
    volumes:
      # Live server code — edits apply after --watch reloads the process
      - ./server:/app/server
      # Onyx: identity and SQLite helpers shared with the Gateway
      - ./shared:/app/shared:ro
      # Onyx: the Gateway's internal API socket and its shared secret
      - ipc:/app/ipc
      # Prompt catalog imported by DecodeBench / Showcase (not under ./server)
      - ./src/shared:/app/src/shared:ro
      - ./src/components/ShowcasePage/showcasePrompts.ts:/app/src/components/ShowcasePage/showcasePrompts.ts:ro
      # Built frontend, served straight from the host. Rebuild it on the host
      # (`npm run build`, or `npm run build:watch` to do it on every save) and just
      # refresh the browser; the container and image are not touched.
      # The directory must exist before `docker compose up` (run `npm run build` once).
      - ./dist:/app/dist:ro
      # Mount host filesystem for local Spark metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # Mount nvidia-smi + driver libs (fallback if nsenter host path fails)
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:/usr/lib/aarch64-linux-gnu/libnvidia-ml.so.1:ro
      # Config + encrypted secrets (passwords survive restarts)
      - ./config:/app/config
      # Remote Sparks with SSH *key* auth: OpenSSH inside the container uses
      # /root/.ssh (not the host user's ~/.ssh). Uncomment and point at a
      # default-named key (id_ed25519 / id_rsa). A custom name like
      # id_ed25519_shared must be mounted *as* id_ed25519, or set
      # SSH_IDENTITY_FILE to the path inside the container.
      # - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
    environment:
      # Secure default: host-networked service listens only on loopback.
      # See docs/REMOTE-ACCESS.md; direct non-loopback binds fail closed.
      - BIND_HOST=${BIND_HOST:-127.0.0.1}
      - SPARKDASH_TOKEN=${SPARKDASH_TOKEN:-}
      - SPARKDASH_ALLOW_OPEN_REMOTE=${SPARKDASH_ALLOW_OPEN_REMOTE:-1}
      - SPARKDASH_ALLOWED_HOSTS=${SPARKDASH_ALLOWED_HOSTS:-}
      - PORT=5555
      - LLM_PORT=8888
      - NODE_ENV=production
      - HOST_PROC_PATH=/host/proc
      - HOST_SYS_PATH=/host/sys
      - HOST_ROOT_PATH=/host/root
      - SSH_CONTROL_PERSIST_SECONDS=${SSH_CONTROL_PERSIST_SECONDS:-60}
      - SSH_IDENTITY_FILE=${SSH_IDENTITY_FILE:-}
      # Onyx: where the Gateway listens, for "Publish on your tailnet"
      - GATEWAY_PORT=${GATEWAY_PORT:-5556}

  # Onyx: the AI Gateway. The only place provider keys exist. Unprivileged by design:
  # non-root, read-only root filesystem, all capabilities dropped, no host PID or host
  # filesystem. It mounts only its data, the internal socket and tailscaled's socket (for whois).
  # Host networking so it reaches model servers bound to this machine's loopback.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: sparkDash-gateway
    restart: always
    command: ["node", "gateway/index.js"]
    user: "1000:1000"
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - gateway-data:/app/gateway-data
      - ipc:/app/ipc
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
    environment:
      # 127.0.0.1 by default; publish it with "Publish on your tailnet" (Tailscale Serve :8443).
      - GATEWAY_BIND_HOST=${GATEWAY_BIND_HOST:-127.0.0.1}
      - GATEWAY_PORT=${GATEWAY_PORT:-5556}
      - GATEWAY_ALLOW_PUBLIC_BIND=${GATEWAY_ALLOW_PUBLIC_BIND:-}
      - GATEWAY_MAX_BODY_MB=${GATEWAY_MAX_BODY_MB:-32}
      - GATEWAY_SECRETS_KEY=${GATEWAY_SECRETS_KEY:-}
      # Optional: provider keys from the environment instead of the Models tab.
      - GATEWAY_ANTHROPIC_API_KEY=${GATEWAY_ANTHROPIC_API_KEY:-}
      - GATEWAY_OPENAI_API_KEY=${GATEWAY_OPENAI_API_KEY:-}
      - GATEWAY_GEMINI_API_KEY=${GATEWAY_GEMINI_API_KEY:-}
      - NODE_ENV=production

volumes:
  # Onyx: the Gateway's database, encrypted provider keys and key file. The Observer never mounts it.
  gateway-data:
  # Onyx: the internal API socket and its secret, shared by the Gateway (creates) and the Observer (reads).
  ipc:
